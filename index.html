<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#14123a">
  <title>狐兔 · 齿轮沙漠星</title>
  <link rel="icon" href="assets/coin1.png">
  <link rel="stylesheet" href="style.css">
  <script src="game.js" defer></script>
</head>
<body>
  <main id="viewport" aria-label="狐兔 · 齿轮沙漠星">
    <div id="scene">
      <canvas id="game" width="480" height="270" aria-label="齿轮沙漠星第一关"></canvas>
      <div id="title-screen" hidden>
        <h1>狐兔 <span>·</span> 齿轮沙漠星</h1>
        <button id="start" type="button">点击开始</button>
      </div>
      <p id="load-error" role="alert" hidden>资源加载失败</p>
      <div id="hints">
        <p id="move-hint" class="hint" hidden>◀ ▶ 移动　跳：跳跃</p>
        <p id="glide-hint" class="hint" hidden>空中按住跳 = 螺旋桨滑翔</p>
        <p id="wall-hint" class="hint" hidden>需要“扒墙”能力，之后再回来吧</p>
      </div>
      <div id="touch-controls" hidden>
        <div class="directions">
          <button type="button" data-action="left" aria-label="向左">◀</button>
          <button type="button" data-action="right" aria-label="向右">▶</button>
        </div>
        <button type="button" data-action="jump" aria-label="跳跃">跳</button>
      </div>
      <div id="completion" role="dialog" aria-modal="true" aria-labelledby="completion-title" hidden>
        <div class="panel">
          <img src="assets/coin1.png" width="30" height="30" alt="">
          <h2 id="completion-title">第一关完成！</h2>
          <p id="result"></p>
          <button id="replay" type="button">再玩一次</button>
        </div>
      </div>
    </div>
  </main>
</body>
</html>
